[pytest]
# Used only when no test path, module or node ID is supplied on the command line.
testpaths = rhos_lightspeed_tests.tests
addopts = --verbose --junitxml=test-results.xml
# Keep captured stdout in the JUnit report (e.g. the goose run elapsed time).
junit_logging = system-out
python_files = test_*.py
python_functions = test_*
markers =
    llm_dependent: requires generated answer content from a real LLM
