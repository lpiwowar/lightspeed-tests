[pytest]
# Used only when no test path, module or node ID is supplied on the command line.
testpaths = rhos_lightspeed_tests.tests
addopts = --verbose --junitxml=test-results.xml -m "not openstack_assistant"
python_files = test_*.py
python_functions = test_*
markers =
    llm_dependent: requires generated answer content from a real LLM
    openstack_assistant: requires access to an OpenStack Assistant deployment
    openshift_dependent: requires access to an OpenShift cluster
